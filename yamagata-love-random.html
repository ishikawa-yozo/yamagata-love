<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山形愛♡検定</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Meiryo,sans-serif;background:linear-gradient(135deg,#6b9fff,#a855f7,#6b9fff);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
.container{background:white;border-radius:20px;padding:30px;max-width:620px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
#start-screen{text-align:center;}
.title-emoji{font-size:60px;margin-bottom:10px;}
.title-main{font-size:32px;font-weight:bold;color:#5b21b6;margin-bottom:5px;}
.title-sub{font-size:16px;color:#666;margin-bottom:20px;}
.title-desc{background:#f5f0ff;border:2px solid #a855f7;border-radius:12px;padding:20px;margin:20px 0;text-align:left;font-size:14px;line-height:1.8;color:#444;}
.title-desc h3{color:#5b21b6;font-size:16px;margin-bottom:10px;text-align:center;}
.rule-item{display:flex;align-items:flex-start;margin:6px 0;}
.rule-icon{margin-right:8px;}
.btn-start{background:linear-gradient(135deg,#5b21b6,#a855f7);color:white;border:none;padding:16px;font-size:20px;font-weight:bold;border-radius:50px;cursor:pointer;margin-top:20px;width:100%;transition:all 0.3s;}
.btn-start:hover{transform:translateY(-2px);}
#quiz-screen{display:none;}
.progress-area{display:flex;justify-content:space-between;margin-bottom:15px;}
.question-num{font-size:14px;color:#888;font-weight:bold;}
.score-display{font-size:14px;color:#5b21b6;font-weight:bold;}
.progress-bar{width:100%;height:8px;background:#eee;border-radius:4px;margin-bottom:20px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#5b21b6,#a855f7);border-radius:4px;transition:width 0.5s;}
.question-box{background:#f5f0ff;border-left:5px solid #a855f7;border-radius:0 12px 12px 0;padding:20px;margin-bottom:25px;font-size:18px;font-weight:bold;color:#333;line-height:1.6;min-height:80px;display:flex;align-items:center;}
.choices{display:flex;flex-direction:column;gap:12px;}
.choice-btn{background:#f8f8f8;border:2px solid #ddd;border-radius:12px;padding:15px 20px;font-size:16px;cursor:pointer;text-align:left;transition:all 0.2s;color:#333;display:flex;align-items:center;}
.choice-btn:hover:not(:disabled){background:#f5f0ff;border-color:#a855f7;transform:translateX(5px);}
.choice-label{background:#5b21b6;color:white;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;margin-right:12px;flex-shrink:0;}
.choice-btn.correct{background:#d4edda;border-color:#28a745;}
.choice-btn.correct .choice-label{background:#28a745;}
.choice-btn.wrong{background:#f8d7da;border-color:#dc3545;}
.choice-btn.wrong .choice-label{background:#dc3545;}
.choice-btn.show-answer{background:#d4edda;border-color:#28a745;opacity:0.8;}
.choice-btn.show-answer .choice-label{background:#28a745;}
.choice-btn:disabled{cursor:not-allowed;}
.explanation-box{display:none;background:#e8f4fd;border:2px solid #2196F3;border-radius:12px;padding:15px;margin-top:20px;font-size:14px;color:#444;line-height:1.7;}
.explanation-box.show{display:block;}
.explanation-title{font-weight:bold;color:#2196F3;margin-bottom:5px;}
.result-icon{text-align:center;font-size:36px;margin-top:15px;display:none;}
.result-icon.show{display:block;}
.btn-next{display:none;background:linear-gradient(135deg,#333,#555);color:white;border:none;padding:14px;font-size:16px;font-weight:bold;border-radius:50px;cursor:pointer;margin-top:20px;width:100%;transition:all 0.3s;}
.btn-next.show{display:block;}
#result-screen{display:none;text-align:center;}
.score-circle{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto;font-weight:bold;}
.score-circle.pass{background:linear-gradient(135deg,#28a745,#20c997);color:white;box-shadow:0 10px 30px rgba(40,167,69,0.4);}
.score-circle.fail{background:linear-gradient(135deg,#dc3545,#ff6b6b);color:white;box-shadow:0 10px 30px rgba(220,53,69,0.4);}
.score-number{font-size:48px;line-height:1;}
.score-label{font-size:16px;}
.certificate{background:linear-gradient(135deg,#f3e8ff,#e9d5ff);border:3px solid #a855f7;border-radius:15px;padding:25px;margin:20px 0;}
.certificate-title{font-size:13px;color:#888;letter-spacing:3px;}
.certificate-main{font-size:20px;font-weight:bold;color:#5b21b6;line-height:1.8;margin:10px 0;}
.certificate-seal{font-size:50px;margin:10px 0;}
.certificate-date{font-size:13px;color:#888;margin-top:10px;}
.fail-message{background:#fff0f0;border:2px solid #ffcccc;border-radius:12px;padding:20px;margin:20px 0;color:#666;line-height:1.8;}
.answer-review{text-align:left;margin:20px 0;}
.answer-review h3{font-size:16px;color:#555;margin-bottom:12px;border-bottom:2px solid #eee;padding-bottom:8px;}
.answer-item{display:flex;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px;}
.answer-mark{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0;margin-right:10px;margin-top:2px;}
.answer-mark.correct{background:#28a745;color:white;}
.answer-mark.wrong{background:#dc3545;color:white;}
.answer-text{flex:1;color:#444;line-height:1.5;}
.answer-correct-text{color:#28a745;font-size:12px;}
.btn-group{display:flex;gap:12px;margin-top:20px;}
.btn-retry{flex:1;background:linear-gradient(135deg,#5b21b6,#a855f7);color:white;border:none;padding:14px;font-size:15px;font-weight:bold;border-radius:50px;cursor:pointer;transition:all 0.3s;}
.btn-retry:hover{transform:translateY(-2px);}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn 0.4s ease forwards;}
@media(max-width:480px){.container{padding:20px 15px;}.title-main{font-size:26px;}.question-box{font-size:15px;}.choice-btn{font-size:14px;padding:12px 15px;}.btn-group{flex-direction:column;}}
</style>
</head>
<body>
<div class="container">

  <!-- タイトル画面 -->
  <div id="start-screen">
    <div class="title-emoji">🍒🏔️⛄</div>
    <div class="title-main">山形愛♡検定</div>
    <div class="title-sub">〜 あなたの山形愛を試そう！〜</div>
    <div class="title-desc">
      <h3>📋 検定ルール</h3>
      <div class="rule-item"><span class="rule-icon">🎯</span><span>100問の中からランダムに <strong>10問</strong> 出題</span></div>
      <div class="rule-item"><span class="rule-icon">📝</span><span>各問題は <strong>3択</strong> 形式</span></div>
      <div class="rule-item"><span class="rule-icon">✅</span><span><strong>8問以上正解（正解率80%）</strong> で合格！</span></div>
      <div class="rule-item"><span class="rule-icon">🏆</span><span>合格すると <strong>山形愛♡名誉県民</strong> に認定！</span></div>
      <div class="rule-item"><span class="rule-icon">📍</span><span>歴史・グルメ・観光・文化など幅広く出題</span></div>
    </div>
    <button class="btn-start" onclick="startQuiz()">🌸 検定スタート！</button>
  </div>

  <!-- 問題画面 -->
  <div id="quiz-screen">
    <div class="progress-area">
      <div class="question-num" id="question-num">第 1 問 / 全 10 問</div>
      <div class="score-display" id="score-display">正解: 0問</div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="question-box" id="question-text"></div>
    <div class="choices" id="choices"></div>
    <div class="result-icon" id="result-icon"></div>
    <div class="explanation-box" id="explanation-box">
      <div class="explanation-title">💡 解説</div>
      <div id="explanation-text"></div>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">次の問題へ →</button>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen">
    <div id="result-content"></div>
  </div>

</div>

<script>
const allQuestions = [
  {q:"山形県の県庁所在地はどこですか？",
   choices:["米沢市","山形市","鶴岡市"],answer:1,
   explanation:"山形市は山形県の県庁所在地で、県の中央部に位置する政治・経済・文化の中心都市です。"},

  {q:"山形県の県の花は何ですか？",
   choices:["サクラ","ベニバナ","ウメ"],answer:1,
   explanation:"ベニバナは山形県の県花で、江戸時代から染料・口紅の原料として栽培され山形の代表的な農産物です。"},

  {q:"山形県を代表するさくらんぼのブランド品種は何ですか？",
   choices:["ナポレオン","佐藤錦","高砂"],answer:1,
   explanation:"佐藤錦は山形県生まれのさくらんぼの最高級品種で「さくらんぼの王様」と呼ばれています。"},

  {q:"山形県にある東北最高峰の山はどれですか？",
   choices:["鳥海山","月山","蔵王山"],answer:0,
   explanation:"鳥海山（ちょうかいさん）は標高2,236mで東北最高峰の山です。山形県と秋田県の県境に位置しています。"},

  {q:"蔵王温泉で冬に見られる有名な自然現象は何ですか？",
   choices:["流氷","樹氷（スノーモンスター）","オーロラ"],answer:1,
   explanation:"蔵王の樹氷はアオモリトドマツに雪と氷が付着した「スノーモンスター」とも呼ばれる幻想的な自然現象です。"},

  {q:"山形県を代表する郷土料理・芋煮の主役となる食材は何ですか？",
   choices:["じゃがいも","里芋","サツマイモ"],answer:1,
   explanation:"山形の芋煮は里芋を使った鍋料理で、毎年9月に最上川河川敷で行われる「日本一の芋煮会」は有名です。"},

  {q:"山形県で将棋駒の生産が盛んな都市はどこですか？",
   choices:["天童市","山形市","寒河江市"],answer:0,
   explanation:"天童市は全国の将棋駒の約95%を生産する将棋駒の一大産地で「将棋の町」として知られています。"},

  {q:"松尾芭蕉が「奥の細道」で訪れ有名な俳句を詠んだ場所はどこですか？",
   choices:["山寺（立石寺）","出羽三山","最上峡"],answer:0,
   explanation:"山寺（立石寺）で芭蕉が詠んだ「閑さや岩にしみ入る蝉の声」は日本を代表する俳句の一つです。"},

  {q:"山形県の庄内地方で生産される有名なブランド米はどれですか？",
   choices:["魚沼コシヒカリ","つや姫","あきたこまち"],answer:1,
   explanation:"つや姫は山形県が開発したブランド米で、そのおいしさから全国的に高い評価を得ています。"},

  {q:"出羽三山に含まれない山はどれですか？",
   choices:["羽黒山","月山","鳥海山"],answer:2,
   explanation:"出羽三山は羽黒山・月山・湯殿山の三山を指します。鳥海山は出羽三山には含まれません。"},

  {q:"銀山温泉が有名な理由として正しいのはどれですか？",
   choices:["日本最古の温泉","大正ロマン風の旅館街","世界遺産に登録されている"],answer:1,
   explanation:"銀山温泉は大正時代の洋風木造建築が立ち並ぶ旅館街が有名で、NHKドラマのロケ地としても知られます。"},

  {q:"山形県で毎年8月に開催される東北四大祭りの一つはどれですか？",
   choices:["山形花笠まつり","山形芋煮まつり","山形雪灯篭まつり"],answer:0,
   explanation:"山形花笠まつりは毎年8月5〜7日に開催される東北四大祭りの一つで、花笠音頭に合わせた踊りが有名です。"},

  {q:"山形県の米沢市で有名なブランド牛はどれですか？",
   choices:["山形牛","米沢牛","庄内牛"],answer:1,
   explanation:"米沢牛は日本三大和牛の一つとして知られる最高級ブランド牛で、米沢市周辺で育てられています。"},

  {q:"最上川について正しいのはどれですか？",
   choices:["日本最長の川","日本三大急流の一つ","世界遺産に登録されている"],answer:1,
   explanation:"最上川は日本三大急流の一つで、松尾芭蕉も「五月雨をあつめて早し最上川」と詠みました。"},

  {q:"山形県で生産量日本一を誇る果物はどれですか？",
   choices:["リンゴ","さくらんぼ","ブドウ"],answer:1,
   explanation:"山形県はさくらんぼの生産量が全国1位で、全国シェアの約70%を占める「さくらんぼ王国」です。"},

  {q:"鶴岡市にある世界一のクラゲ水族館はどれですか？",
   choices:["加茂水族館","庄内水族館","鶴岡水族館"],answer:0,
   explanation:"鶴岡市立加茂水族館はクラゲの展示種類数が世界一の水族館で「クラゲドリーム館」とも呼ばれています。"},

  {q:"山形県の伝統的な織物「置賜紬」の産地として有名な都市はどれですか？",
   choices:["山形市","米沢市","新庄市"],answer:1,
   explanation:"米沢市を中心とする置賜地方では米沢織（置賜紬）が生産され、国の伝統的工芸品に指定されています。"},

  {q:"山形県にある日本百名山でスキーリゾートとしても有名な山はどれですか？",
   choices:["朝日岳","蔵王山","葉山"],answer:1,
   explanation:"蔵王山は山形・宮城両県にまたがる火山で、蔵王温泉スキー場は日本有数のスキーリゾートとして知られています。"},

  {q:"山形県の郷土料理「だし」とはどのような料理ですか？",
   choices:["魚介類のスープ","夏野菜を細かく刻んだ薬味","山菜の煮物"],answer:1,
   explanation:"「だし」はキュウリ・ナス・オクラなどの夏野菜を細かく刻んで醤油などで和えた山形の郷土料理です。"},

  {q:"山形県の県の木は何ですか？",
   choices:["スギ","サクランボの木","ケヤキ"],answer:2,
   explanation:"ケヤキは山形県の県木です。山形市内にも多くのケヤキが植えられています。"},

{q:"山形県の面積は全国で何番目に大きいですか？",
   choices:["3番目","6番目","10番目"],answer:1,
   explanation:"山形県の面積は約9,323㎢で全国6番目の広さを誇ります。"},

  {q:"山形県の人口は約何万人ですか？",
   choices:["約50万人","約80万人","約110万人"],answer:2,
   explanation:"山形県の人口は約110万人前後で、少子高齢化による人口減少が課題となっています。"},

  {q:"山形県の県の鳥は何ですか？",
   choices:["ハクチョウ","オシドリ","トキ"],answer:1,
   explanation:"オシドリは山形県の県鳥です。山形県内の河川や湖沼で見ることができます。"},

  {q:"山形県の県の獣は何ですか？",
   choices:["ツキノワグマ","カモシカ","キツネ"],answer:1,
   explanation:"カモシカは山形県の県獣で、山形県内の山岳地帯に生息しています。国の特別天然記念物です。"},

  {q:"山形県の形として正しいのはどれですか？",
   choices:["東西に長い形","南北に長い形","ほぼ正方形"],answer:1,
   explanation:"山形県は南北に長い形をしており、内陸部と庄内平野（日本海側）の2つの地域に大きく分かれます。"},

  {q:"山形県の主な地方区分として正しいのはどれですか？",
   choices:["村山・置賜・最上・庄内","山形・米沢・酒田・新庄","内陸・沿岸・山間・平野"],answer:0,
   explanation:"山形県は村山・置賜・最上・庄内の4つの地方に区分されます。それぞれ文化や気候が異なります。"},

  {q:"山形市で毎年2月に開催される冬のイベントは何ですか？",
   choices:["山形雪灯篭まつり","蔵王樹氷まつり","山形冬物語"],answer:0,
   explanation:"山形雪灯篭まつりは毎年2月に山形城跡（霞城公園）で開催される冬の風物詩です。"},

  {q:"山形県の酒田市にある有名な旧家・豪商の屋敷はどれですか？",
   choices:["本間家旧本邸","鶴岡城","最上屋敷"],answer:0,
   explanation:"本間家は江戸時代に「本間様には及びもないが、せめてなりたや殿様に」と謳われた豪商の旧家です。"},

  {q:"山形県の庄内地方にある有名な神社はどれですか？",
   choices:["出羽神社（三神合祭殿）","山形八幡宮","最上神社"],answer:0,
   explanation:"出羽三山の羽黒山山頂にある出羽神社（三神合祭殿）は庄内地方を代表する由緒ある神社です。"},

  {q:"山形県で生産される「だだちゃ豆」はどこの名産品ですか？",
   choices:["山形市","鶴岡市","酒田市"],answer:1,
   explanation:"だだちゃ豆は鶴岡市の特産品で、強い甘みと風味が特徴の枝豆の一種です。鶴岡市でしか栽培されません。"},

  {q:"山形県の新庄市で毎年8月に開催される祭りは何ですか？",
   choices:["新庄まつり","最上川まつり","新庄花笠まつり"],answer:0,
   explanation:"新庄まつりは毎年8月24〜26日に開催される山形県北部の代表的な祭りで、絢爛豪華な山車が特徴です。"},

  {q:"山形県の寒河江市で有名な果物は何ですか？",
   choices:["ラ・フランス","モモ","ブドウ"],answer:0,
   explanation:"寒河江市は西洋梨「ラ・フランス」の生産が盛んで、山形県全体でも全国トップクラスの生産量を誇ります。"},

  {q:"山形県の上山（かみのやま）温泉で有名なのは何ですか？",
   choices:["雪見温泉","足湯の多さ","露天風呂の数"],answer:1,
   explanation:"上山温泉は市内に多くの足湯が設置されており、気軽に温泉が楽しめる観光地として人気です。"},

  {q:"山形県産のラ・フランスの全国シェアはどのくらいですか？",
   choices:["約30%","約50%","約80%"],answer:2,
   explanation:"山形県はラ・フランス（西洋梨）の全国生産量の約80%を占める、日本最大の産地です。"},

  {q:"山形県の米沢市出身の戦国武将は誰ですか？",
   choices:["伊達政宗","上杉謙信","上杉鷹山"],answer:2,
   explanation:"上杉鷹山（ようざん）は米沢藩主として藩の財政再建に尽力した名君で、米国大統領ケネディも尊敬した人物です。"},

  {q:"山形県の鉄道路線「山形新幹線」の愛称は何ですか？",
   choices:["つばさ","やまびこ","はやぶさ"],answer:0,
   explanation:"山形新幹線の列車名は「つばさ」で、東京〜新庄間を結んでいます。ミニ新幹線として知られています。"},

  {q:"山形県の山寺（立石寺）は何宗のお寺ですか？",
   choices:["真言宗","天台宗","曹洞宗"],answer:1,
   explanation:"山寺（立石寺）は860年に慈覚大師円仁が開いた天台宗の寺院で、1,000段以上の石段が有名です。"},

  {q:"山形県で「そば王国」とも呼ばれるほどそばが盛んな理由は何ですか？",
   choices:["気候と土壌がそばの栽培に適している","そば職人が多い","そばの輸入量が多い"],answer:0,
   explanation:"山形県は内陸の冷涼な気候と土壌がそばの栽培に適しており、風味豊かなそばが育つ「そば王国」です。"},

  {q:"山形県の「加茂水族館」が世界記録を持つクラゲの展示種類数はおよそ何種類ですか？",
   choices:["約30種類","約60種類","約100種類"],answer:1,
   explanation:"鶴岡市立加茂水族館は約60種類以上のクラゲを展示しており、ギネス世界記録に認定されたこともあります。"},

  {q:"山形県の「新庄まつり」の山車（だし）の特徴はどれですか？",
   choices:["花火が打ち上げられる","絢爛豪華な人形飾りの山車","巨大な灯籠"],answer:1,
   explanation:"新庄まつりの山車は歴史上の人物や物語を豪華な人形で表現した絢爛豪華なもので、国の重要無形民俗文化財です。"},

  {q:"山形県の「赤湯温泉」で有名な入浴方法はどれですか？",
   choices:["ワイン風呂","日本酒風呂","牛乳風呂"],answer:0,
   explanation:"赤湯温泉のある南陽市はぶどうの産地でワインの生産も盛んなため、ワイン風呂が名物となっています。"},

  {q:"山形県の「山形市」の夏の風物詩として有名な食べ物はどれですか？",
   choices:["冷やしラーメン","冷やし中華","冷やしそば"],answer:0,
   explanation:"山形市発祥の「冷やしラーメン」は冷たいスープのラーメンで、暑い夏の山形を代表するご当地グルメです。"},

  {q:"山形県の「村山地方」の中心都市はどこですか？",
   choices:["山形市","天童市","寒河江市"],answer:0,
   explanation:"山形市は村山地方の中心都市であり、山形県全体の県庁所在地として政治・経済・文化の中心を担っています。"}

];

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];

function getRandomQuestions(num) {
  const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, num);
}

function startQuiz() {
  currentQuestions = getRandomQuestions(10);
  currentIndex = 0;
  score = 0;
  userAnswers = [];
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  const q = currentQuestions[currentIndex];
  document.getElementById('progress-fill').style.width = (currentIndex / 10 * 100) + '%';
  document.getElementById('question-num').textContent = '第 ' + (currentIndex + 1) + ' 問 / 全 10 問';
  document.getElementById('score-display').textContent = '正解: ' + score + '問';
  document.getElementById('question-text').textContent = q.q;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  ['A','B','C'].forEach(function(label, index) {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = '<span class="choice-label">' + label + '</span>' + q.choices[index];
    btn.onclick = function() { selectAnswer(index); };
    choicesEl.appendChild(btn);
  });

  document.getElementById('explanation-box').classList.remove('show');
  document.getElementById('explanation-text').textContent = '';
  document.getElementById('result-icon').classList.remove('show');
  document.getElementById('result-icon').textContent = '';
  document.getElementById('btn-next').classList.remove('show');
  document.getElementById('btn-next').textContent = currentIndex === 9 ? '結果を見る 🏁' : '次の問題へ →';
}

function selectAnswer(selectedIndex) {
  const q = currentQuestions[currentIndex];
  const buttons = document.querySelectorAll('.choice-btn');
  buttons.forEach(function(btn) { btn.disabled = true; });

  const isCorrect = (selectedIndex === q.answer);
  if (isCorrect) {
    buttons[selectedIndex].classList.add('correct');
  } else {
    buttons[selectedIndex].classList.add('wrong');
    buttons[q.answer].classList.add('show-answer');
  }

  const resultIcon = document.getElementById('result-icon');
  resultIcon.classList.add('show');
  if (isCorrect) {
    resultIcon.textContent = '⭕ 正解！';
    resultIcon.style.color = '#28a745';
    score++;
  } else {
    resultIcon.textContent = '❌ 不正解…';
    resultIcon.style.color = '#dc3545';
  }

  document.getElementById('explanation-text').textContent = q.explanation;
  document.getElementById('explanation-box').classList.add('show');
  document.getElementById('btn-next').classList.add('show');
  document.getElementById('score-display').textContent = '正解: ' + score + '問';

  userAnswers.push({
    question: q.q,
    isCorrect: isCorrect,
    correctText: q.choices[q.answer]
  });
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= 10) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const isPassed = score >= 8;
  const today = new Date();
  const dateStr = today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日';

  let reviewHTML = '<div class="answer-review"><h3>📋 回答一覧</h3>';
  userAnswers.forEach(function(ans, i) {
    reviewHTML += '<div class="answer-item">';
    reviewHTML += '<div class="answer-mark ' + (ans.isCorrect ? 'correct' : 'wrong') + '">' + (ans.isCorrect ? '○' : '×') + '</div>';
    reviewHTML += '<div class="answer-text"><div>Q' + (i + 1) + '. ' + ans.question + '</div>';
    if (!ans.isCorrect) {
      reviewHTML += '<div class="answer-correct-text">✅ 正解: ' + ans.correctText + '</div>';
    }
    reviewHTML += '</div></div>';
  });
  reviewHTML += '</div>';

  const btnHTML = '<div class="btn-group"><button class="btn-retry" onclick="startQuiz()">🔄 もう一度挑戦</button><button class="btn-retry" style="background:linear-gradient(135deg,#333,#555);" onclick="backToTop()">🏠 トップへ戻る</button></div>';

  let resultHTML = '';
  if (isPassed) {
    resultHTML = '<div class="fade-in">'
      + '<div style="font-size:24px;font-weight:bold;color:#333;margin-bottom:10px;">🎉 合格おめでとうございます！</div>'
      + '<div class="score-circle pass"><div class="score-number">' + score + '<span style="font-size:24px;">/10</span></div><div class="score-label">正解</div></div>'
      + '<div class="certificate">'
      + '<div class="certificate-title">認　定　証</div>'
      + '<div class="certificate-seal">🍒</div>'
      + '<div class="certificate-main">あなたを<br>山形愛♡ある<br>名誉県民として認めます</div>'
      + '<div style="font-size:13px;color:#666;margin-top:10px;">正解数: ' + score + ' / 10問（正解率 ' + (score * 10) + '%）</div>'
      + '<div class="certificate-date">認定日: ' + dateStr + '</div>'
      + '<div style="margin-top:10px;font-size:20px;">🏔️⛄🌸</div>'
      + '</div>'
      + reviewHTML + btnHTML + '</div>';
  } else {
    resultHTML = '<div class="fade-in">'
      + '<div style="font-size:24px;font-weight:bold;color:#333;margin-bottom:10px;">結果発表</div>'
      + '<div class="score-circle fail"><div class="score-number">' + score + '<span style="font-size:24px;">/10</span></div><div class="score-label">正解</div></div>'
      + '<div class="fail-message">'
      + '<div style="font-size:18px;font-weight:bold;color:#dc3545;margin-bottom:10px;">😢 残念！不合格です</div>'
      + '<div>合格ライン: <strong>8問以上</strong></div>'
      + '<div>あなたの正解数: <strong>' + score + '問 / 10問</strong></div>'
      + '<div>正解率: <strong>' + (score * 10) + '%</strong></div>'
      + '<div style="margin-top:10px;">もう一度挑戦して、山形愛♡名誉県民を目指しましょう！</div>'
      + '</div>'
      + reviewHTML + btnHTML + '</div>';
  }

  document.getElementById('result-content').innerHTML = resultHTML;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToTop() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
